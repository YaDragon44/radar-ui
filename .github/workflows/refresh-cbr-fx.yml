name: Refresh CBR FX quote
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cbr_fx.py'
      - '.github/workflows/refresh-cbr-fx.yml'
permissions:
  contents: write
concurrency:
  group: radar-cbr-fx-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate updater
        run: python -m py_compile scripts/refresh_cbr_fx.py
      - name: Fetch confirmed CBR quotes
        run: python scripts/refresh_cbr_fx.py
      - name: Commit changed source facts
        run: |
          git config user.name "RADAR Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add ruble-data.js
          if git diff --cached --quiet; then
            echo "NO_OP: same official CBR quote"
            exit 0
          fi
          git commit -m "data: refresh official CBR FX quotes"
          git push origin main
